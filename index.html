<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Worm3-Puzzle: Antipodal Topology via Rubik's Cube</title>
    <!-- Bungee is self-hosted via @fontsource/bungee (imported in main.jsx) -->
  </head>
  <body>
    <style>
      /* Boot splash — pure HTML/CSS so it paints instantly, long before the JS
         bundle parses. It lives inside #root, so React replaces it the moment
         the app mounts. No webfonts here on purpose: heavy system sans only. */
      #boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        /* The opening's cream graph paper (utils/paperGrid.js: 26 squares a screen tall),
           so the boot splash, the opening and the loading screen are one sheet. */
        background-color: #f5f2e7;
        background-image: radial-gradient(ellipse at 50% 45%, #faf7eb, rgba(250, 247, 235, 0) 75%),
          linear-gradient(rgba(163, 173, 156, 0.4) 1px, transparent 1px),
          linear-gradient(90deg, rgba(163, 173, 156, 0.4) 1px, transparent 1px);
        background-size: 100% 100%, calc(100vh / 26) calc(100vh / 26), calc(100vh / 26) calc(100vh / 26);
        background-position: center;
        z-index: 99999;
      }
      #boot-splash .bs-title {
        font-family: 'Arial Black', 'Franklin Gothic Bold', sans-serif;
        font-size: clamp(38px, 11vw, 64px);
        letter-spacing: 0.06em;
        color: #26372d;
        text-shadow: 0 3px 0 rgba(38, 55, 45, 0.18);
        animation: bs-pulse 1.6s ease-in-out infinite;
      }
      #boot-splash .bs-title sup { font-size: 0.55em; color: #ffd500; -webkit-text-stroke: 1px #26372d; }
      #boot-splash .bs-bar {
        width: min(220px, 56vw); height: 12px; box-sizing: border-box; border-radius: 999px;
        border: 2px solid #26372d; background: #fffcf1; box-shadow: 0 3px 0 #26372d; overflow: hidden;
      }
      #boot-splash .bs-bar i {
        display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #c41e3a, #ff7a00, #ffd500, #009b48, #0051a2);
        animation: bs-slide 1.1s ease-in-out infinite;
      }
      @keyframes bs-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
      @keyframes bs-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-title, #boot-splash .bs-bar i { animation: none; }
      }
    </style>
    <div id="root">
      <div id="boot-splash" aria-label="Loading WORM cubed">
        <div class="bs-title">WORM<sup>3</sup></div>
        <div class="bs-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
