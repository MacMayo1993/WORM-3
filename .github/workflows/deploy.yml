name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch or PR, so a PR's checks can never bump a deploy off
# main. All runs used to share the "pages" group, and GitHub keeps only one
# pending run per group: a PR pushed while main's run was waiting cancelled
# main's run, and that merge never deployed. A newer push to the same PR
# supersedes its older checks; main's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Budget gate: per-asset ceilings plus the initial-route aggregate, so a
      # regression that arrives as several sub-threshold chunks still fails.
      - name: Check bundle budgets
        run: npm run bundle:check

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Real-browser smoke tests against the production build: the unit suite is jsdom,
  # so it cannot see a blank canvas, a thumbnail that never draws, or a page that
  # dies on load. Software-rendered WebGL makes this the slowest job, so it runs
  # beside the others rather than ahead of them.
  #
  # It does not gate `deploy` yet: a brand-new browser suite should earn that by
  # running green for a while. To make it a release gate, add `e2e` to the
  # `needs:` of the deploy job (and/or require it in branch protection).
  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run e2e:install

      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run e2e

      - name: Upload Mega Storm visual check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-storm-visual-check
          path: test-results/**/mega-storm.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy
    # Only the publish step is serialised, and only main reaches it, so a
    # deploy can be replaced only by a newer main deploy, which carries it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
