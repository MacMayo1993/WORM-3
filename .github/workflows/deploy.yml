name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One queue per branch or PR, so a PR's checks can never bump a deploy off
# main. All runs used to share the "pages" group, and GitHub keeps only one
# pending run per group: a PR pushed while main's run was waiting cancelled
# main's run, and that merge never deployed. A newer push to the same PR
# supersedes its older checks; main's runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Budget gate: per-asset ceilings plus the initial-route aggregate, so a
      # regression that arrives as several sub-threshold chunks still fails.
      - name: Check bundle budgets
        run: npm run bundle:check

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          include-hidden-files: true
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Validate the same production build that is uploaded for Pages. Browser
  # failures must block publication, including graphics startup regressions.
  browser:
    name: Browser smoke tests (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: build
    strategy:
      # Keep each software-GL queue bounded even on slower hosted runners.
      # Test-level sharding avoids assigning the entire Store file to one job;
      # one worker per shard still renders only one browser at a time.
      # Every test runs once; every shard must pass the aggregate gate.
      fail-fast: false
      matrix:
        project: [desktop, phone]
        shard: [1, 2]
    # Playwright 1.56.1 supports 24.04; ubuntu-latest now selects 26.04,
    # whose dependencies it cannot install. Keep both browser gates runnable.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run e2e:install

      - name: Download production build
        id: production_build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      # Publish the focused screenshot before unrelated long-running smoke tests.
      # Separate output folders keep its traces/report when the next run cleans up.
      - name: Run Mega Storm visual check
        if: matrix.project == 'desktop' && matrix.shard == 1
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: mega-storm-report
        run: npm run e2e -- e2e/megaStorm.e2e.js --output=mega-storm-results

      - name: Upload Mega Storm visual check
        if: always() && matrix.project == 'desktop' && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: mega-storm-visual-check
          path: mega-storm-results/**/mega-storm.png
          if-no-files-found: ignore
          retention-days: 7

      # Preserve every remaining test exactly once, even if the focused test
      # failed. Neither invocation allows failures; either makes this job red.
      - name: Run remaining browser tests
        if: ${{ !cancelled() && steps.production_build.outcome == 'success' }}
        run: |
          mapfile -d '' -t tests < <(
            find e2e -type f -name '*.e2e.js' ! -path 'e2e/megaStorm.e2e.js' -print0 | sort -z
          )
          if ((${#tests[@]})); then npm run e2e -- --project="${{ matrix.project }}" --fully-parallel --workers=1 --shard="${{ matrix.shard }}/2" "${tests[@]}"; fi

      - name: Upload Glass view visual check
        if: always() && matrix.project == 'desktop'
        uses: actions/upload-artifact@v4
        with:
          name: glass-view-visual-check-${{ matrix.shard }}
          path: test-results/**/glass-view.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Store visual check
        if: always() && matrix.project == 'phone'
        uses: actions/upload-artifact@v4
        with:
          name: store-visual-check-${{ matrix.shard }}
          path: test-results/**/store-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload charged chamber visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charged-chamber-visual-check-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/**/charged-mirrors-*.png
            test-results/**/centred-bent-exit*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            mega-storm-report/
            mega-storm-results/
          retention-days: 7

  # Retain the existing required-check name and block releases unless every
  # browser runner succeeded, including when a runner was cancelled or skipped.
  e2e:
    name: Browser smoke tests
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser runner to pass
        run: test "${{ needs.browser.result }}" = "success"

  deploy:
    name: Deploy
    # Only the publish step is serialised, and only main reaches it, so a
    # deploy can be replaced only by a newer main deploy, which carries it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
