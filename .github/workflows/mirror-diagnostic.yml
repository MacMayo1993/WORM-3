name: Focused mirror rendering verification
on:
  push:
    branches: [diagnostic/mirror-highlight-clipping]
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run e2e:install
      - name: Verify desktop and phone mirrors
        run: |
          printf "import config from './playwright.config.js';\nexport default { ...config, webServer: undefined };\n" > mirror.ci.config.mjs
          npx playwright test -c mirror.ci.config.mjs e2e/chargedMirrorRoom.e2e.js --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-mirror-results
          path: test-results/
          retention-days: 3
