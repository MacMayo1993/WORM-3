name: Focused prismatic chamber verification
on:
  push:
    branches: [diagnostic/prismatic-anticube-chamber]
permissions:
  contents: read
jobs:
  chamber:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run e2e:install
      - name: Verify chamber and wormhole openings
        run: |
          printf "import config from './playwright.config.js';\nexport default { ...config, webServer: undefined };\n" > chamber.ci.config.mjs
          npx playwright test -c chamber.ci.config.mjs e2e/prismaticChamber.e2e.js e2e/wormholeMouth.e2e.js --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-chamber-results
          path: test-results/
          retention-days: 3
