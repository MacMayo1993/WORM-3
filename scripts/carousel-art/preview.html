<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Carousel artwork renderer</title></head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ART_RECIPES, buildArtwork } from './model.js';
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(768, 768); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment(); const env = pmrem.fromScene(room, 0.04); room.dispose();
window.renderArtwork = async id => {
  const scene = new THREE.Scene(); scene.environment = env.texture;
  const artwork = buildArtwork(id); scene.add(artwork);
  scene.add(new THREE.AmbientLight('#fff8eb', 0.45));
  const key = new THREE.DirectionalLight('#fff3dc', 2.5); key.position.set(-3, 7, 8);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 }); scene.add(key);
  const rim = new THREE.DirectionalLight('#d6e8ff', 1.3); rim.position.set(5, 4, -3); scene.add(rim);
  const box = new THREE.Box3().setFromObject(artwork), center = box.getCenter(new THREE.Vector3());
  const camera = new THREE.OrthographicCamera(-3, 3, 3, -3, 0.1, 60);
  camera.position.copy(center).add(new THREE.Vector3(6.8, 5.2, 9)); camera.lookAt(center); camera.updateMatrixWorld();
  // Fit all corners in camera space. Transparent exports cannot silently crop arrows/tails.
  let extent = 0;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    extent = Math.max(extent, Math.abs(p.x), Math.abs(p.y));
  }
  extent *= 1.05;
  camera.left = camera.bottom = -extent; camera.right = camera.top = extent; camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const result = renderer.domElement.toDataURL('image/webp', 0.96);
  const geometries = new Set(), materials = new Set();
  artwork.traverse(node => { if (node.geometry) geometries.add(node.geometry); if (node.material) materials.add(node.material); });
  geometries.forEach(g => g.dispose()); materials.forEach(m => m.dispose()); key.shadow.dispose();
  return result;
};
window.artworkIds = Object.keys(ART_RECIPES);
</script></body></html>
